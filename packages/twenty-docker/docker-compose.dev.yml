# Development infrastructure services only (Postgres + Redis).
# Use this when developing locally against the source code.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down       # stop
#   docker compose -f docker-compose.dev.yml down -v    # stop + wipe data

# Pinned. Compose names a volume <project>_<key>, so this project name and the
# volume key below together resolve to lv-crm-dev_lv-dev-db-data — the volume
# that holds the La Vivenzia workspace. Renaming either one silently creates a
# second, empty volume and the database appears wiped; that is exactly what
# happened on 2026-10-02. Do not change these without migrating the data first.
name: lv-crm-dev

services:
  db:
    image: postgres:16
    volumes:
      - lv-dev-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lv-dev-db-data:
